name: Sid & Isha Daily Instagram Publisher

on:
  schedule:
    # 04:40 UTC = 10:10 AM IST (Runs daily at 10:10 AM IST)
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Force specific Day number (1-30, leave blank for automatic date matching)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sidisha-publisher
  cancel-in-progress: false

jobs:
  publish-daily-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Instagram Publisher
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID || '17841401278750705' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1738811053' }}
          FORCE_DAY: ${{ github.event.inputs.force_day }}
        run: |
          python scripts/publish_sidisha_daily.py

      - name: Commit and Push Catalog Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nalkudil-social-studio/catalog.js
          if git diff --staged --quiet; then
            echo "Catalog unchanged. Nothing to commit."
          else
            git commit -m "feat(sid-isha): publish daily episode to Instagram [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
