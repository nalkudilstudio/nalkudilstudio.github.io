name: Update Live Metal Rates

on:
  schedule:
    # Runs every 4 hours (at minute 0 past every 4th hour UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

permissions:
  contents: write

concurrency:
  group: rates-updater
  cancel-in-progress: true

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and Normalize Metal Rates
        run: |
          python scripts/fetch_rates.py

      - name: Commit and Push Rates Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          if git diff --staged --quiet; then
            echo "Rates unchanged since last run. Nothing to commit."
          else
            git commit -m "chore(data): update live metal rates [skip ci]"
            git push
          fi
