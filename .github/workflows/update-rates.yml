name: Update Live Metal Rates

on:
  schedule:
    # 07:15 UTC = 12:45 PM IST (Mon-Fri) ~30 mins after IBJA Morning/Opening rate bulletin
    - cron: '15 7 * * 1-5'
    # 12:00 UTC = 05:30 PM IST (Mon-Fri) ~30 mins after IBJA Evening/Closing rate bulletin
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard
    inputs:
      force_telegram:
        description: 'Force send update to Telegram (@SaravMPBot) even if rates unchanged'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: rates-updater
  cancel-in-progress: true

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and Normalize Metal Rates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SNS_BOT_TOKEN: ${{ secrets.SNS_BOT_TOKEN }}
          SNS_CHAT_ID: ${{ secrets.SNS_CHAT_ID }}
          FORCE_TELEGRAM: ${{ github.event.inputs.force_telegram || 'true' }}
        run: |
          python scripts/fetch_rates.py

      - name: Commit and Push Rates Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          if git diff --staged --quiet; then
            echo "Rates unchanged since last run. Nothing to commit."
          else
            git commit -m "chore(data): update live metal rates [skip ci]"
            git push
          fi
